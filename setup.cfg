[metadata]
name = rl-laser
version = 0.1.0
author = Your Name
author_email = you@example.com
description = Physics-informed laser control Gymnasium environments for Reinforcement Learning research.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourname/rl-laser
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
python_requires = >=3.8
install_requires =
    gymnasium>=0.29
    numpy>=1.22
    torch>=1.10
    scipy
    matplotlib
    pillow
    pandas
    # optional extras defined below

[options.extras_require]
visualize =
    pygame>=2.0
dev =
    black
    isort
    pytest
    line_profiler

[options.package_data]
laserenv = data/*

[tool.setuptools.packages.find]
include =
    rl_laser*
    laserenv*
    policy*